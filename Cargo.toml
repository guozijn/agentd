[package]
name = "agentd"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local-first state machine daemon for durable AI agent orchestration"
repository = "https://github.com/guozijn/agentd"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlite",
    "uuid",
    "json",
    "macros"
] }
thiserror = "2.0"
tokio = { version = "1.48", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "time"
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
